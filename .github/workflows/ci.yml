name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint dengan ruff
        run: ruff check src tests app
      - name: Unit test
        run: python -m pytest -q
      - name: Jalankan pipeline (smoke test)
        run: PYTHONPATH=src python -m kurs_forecast.pipeline
